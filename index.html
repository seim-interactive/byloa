    <!-- Tema antes de pintar: si se aplicara desde Vue, quien eligió claro
         vería un destello oscuro en cada carga. Login y panel van siempre en
         oscuro. Por defecto, oscuro. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('byloa-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {}
        if (/^\/(login|admin)/.test(location.pathname)) theme = 'dark'
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f2ed')
        }
      })()
    </script>
